version: '3.8'

services:
  ml-service:
    build: ./ml
    container_name: superdesign_ml_service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: superdesign_backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - ML_SERVICE_URL=http://ml-service:5000
    depends_on:
      - ml-service
    volumes:
      - ./backend/db:/app/db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: superdesign_frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
